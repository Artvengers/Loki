let currentQuestion = 0;
let score = 0;

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startQuiz() {
document.getElementById("start-page").classList.add("hidden");
document.getElementById("quiz-page").classList.remove("hidden");
showQuestion();
}

function showQuestion() {
let q = questions[currentQuestion];
shuffleArray(q.answers);

document.getElementById("question-counter").innerText =
"Question " + (currentQuestion+1) + " / " + questions.length;

document.getElementById("question-text").innerText = q.question;

// ✅ AJOUT IMPORTANT
document.getElementById("person-image").src = q.image;

let container = document.getElementById("answers-container");
container.innerHTML = "";

q.answers.forEach(answer => {
let btn = document.createElement("button");
btn.innerText = answer.text;
btn.classList.add("answer-btn");
btn.onclick = () => selectAnswer(answer.hero);
container.appendChild(btn);
});
}

function selectAnswer(hero) {
    if (hero === "false") {
        score++;   // +1 si le joueur a trouvé la fausse anecdote
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-page").classList.add("hidden");
    document.getElementById("result-page").classList.remove("hidden");

    let resultText = `
        Tu as trouvé ${score} bonne(s) réponse(s) sur ${questions.length}. <br><br>
        ${score >= questions.length * 0.8 ? "Héroïque ! <br> <br> Maintenant envoie un screen de ton score aux AGR sur Insta (@liste_bda_artvengers), la personne qui obtiendra le meilleur score aura une surprise... 🥳 <br> <br> On ne te donne pas la correction tout de suite au cas où tu veuilles donner les réponses à un pote... mais reste branché sur Insta ! <br> <br> Et n'hésite pas à parler des anecdotes à nos listeux pendant la JA !!" : "Pas mal ! 😎 <br> <br> Maintenant envoie un screen de ton score aux AGR sur Insta (@liste_bda_artvengers), la personne qui obtiendra le meilleur score aura une surprise... 🥳 <br> <br> On ne te donne pas la correction tout de suite au cas où tu veuilles recommencer le test... reste branché sur Insta ! <br> <br> Et n'hésite pas à parler des anecdotes à nos listeux pendant la JA !!"}
    `;

    document.getElementById("result-text").innerHTML = resultText;
    document.getElementById("result-image").src = "img-VF/AGR-logo.png"; // image fixe ou vide
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("result-page").classList.add("hidden");
    document.getElementById("start-page").classList.remove("hidden");
}
